<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Une fiche lieu ou artiste de la scène réunionnaise, sur Sén Péi.">
<meta name="theme-color" content="#1A0E08">
<meta property="og:site_name" content="Sén Péi — un Monde Pixie">
<meta property="og:title" content="Une fiche de la scène péi — Sén Péi">
<meta property="og:description" content="Une fiche lieu ou artiste de la scène réunionnaise, sur Sén Péi.">

<meta property="og:locale" content="fr_FR">
<title>Sén Péi — fiche</title>
<link rel="preload" href="fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="commun.css">
<script>document.addEventListener('touchstart',function(){},{passive:true})</script>
<style>
  :root{
    --terre:#1A0E08; --terre2:#27150D; --panel:#33200f;
    --safran:#F6BE54; --brique:#D2602F; --corail:#FF7A47;
    --creme:#F8EFE1; --muet:#C6AC95; --ligne:rgba(255,233,210,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--creme);background:var(--terre);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--ligne)}
  .brand{display:flex;flex-direction:column;line-height:1}
  .logo{font-family:'Fraunces',serif;font-weight:700;font-size:24px;background:linear-gradient(92deg,var(--safran),var(--brique));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sig{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muet);margin-top:3px}
  .back{font-size:14px;color:var(--safran);text-decoration:none}
  .card{background:linear-gradient(180deg,var(--panel),var(--terre2));border:1px solid var(--ligne);border-radius:20px;padding:30px;margin-top:28px}
  .kind{display:inline-block;font-size:12px;letter-spacing:1px;text-transform:uppercase;border-radius:999px;padding:5px 13px;margin-bottom:14px}
  .kind.lieu{background:rgba(246,190,84,.15);color:var(--safran)}
  .kind.artiste{background:rgba(255,122,71,.16);color:var(--corail)}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:34px;line-height:1.1}
  .meta{color:var(--muet);font-size:14px;margin-top:8px}
  .tagrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .tg{font-size:12.5px;padding:4px 11px;border-radius:999px;background:rgba(255,233,210,.08)}
  .tg.pris{background:rgba(210,96,47,.18);color:#f6c9b3}
  .desc{font-size:16px;line-height:1.65;color:#EAD9C5;margin-top:20px;white-space:pre-wrap}
  .video{margin-top:22px;border-radius:14px;overflow:hidden;border:1px solid var(--ligne);aspect-ratio:16/9}
  .video iframe{width:100%;height:100%;border:0;display:block}
  /* Vignette locale : rien n'est demandé à YouTube ou à Vimeo avant le clic */
  .video.vignette{aspect-ratio:auto;container-type:inline-size}
  .lire{width:100%;min-height:56.25cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:16px;border:0;border-radius:0;cursor:pointer;color:var(--creme);font:600 16px 'Inter',system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 40%,rgba(255,122,71,.16),transparent 60%),linear-gradient(180deg,var(--panel),var(--terre2))}
  .lire:active{transform:none}
  .lire:focus-visible{outline-offset:-4px;border-radius:14px}
  .lire .rond{flex:none;display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;padding-left:5px;
    font-size:24px;color:#2a1206;background:linear-gradient(92deg,var(--brique),var(--safran));transition:transform .15s ease-out}
  .lire:hover .rond{transform:scale(1.06)}
  .lire:active .rond{transform:scale(.95)}
  .lire .n{font-weight:400;font-size:13px;color:var(--muet);text-align:center;line-height:1.4}
  @media (max-width:480px){.lire{gap:8px;padding:12px}.lire .rond{width:52px;height:52px;font-size:20px}}
  .field{margin-top:18px;padding-top:16px;border-top:1px solid var(--ligne)}
  .field .l{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muet);margin-bottom:5px}
  .field .v{font-size:15.5px}
  h2{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:30px 0 4px}
  .appel{border:1px solid var(--ligne);border-radius:13px;padding:15px;margin-top:11px}
  .appel b{font-family:'Fraunces',serif;font-size:16px}
  .appel .m{font-size:12.5px;color:var(--muet);margin-top:4px}
  .cta{display:inline-block;margin-top:24px;background:linear-gradient(92deg,var(--brique),var(--safran));color:#2a1206;border-radius:12px;padding:13px 24px;font-size:15px;font-weight:600;text-decoration:none}
  .ghost{border-top:1px solid var(--ligne);margin-top:6px}
  .share{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:none;border:1px solid var(--ligne);color:var(--creme);border-radius:999px;padding:10px 18px;font:500 14px 'Inter',system-ui,sans-serif;cursor:pointer}
  .share:hover{border-color:var(--safran)}
  .lien{display:block;width:100%;margin-top:10px;background:var(--terre2);border:1px solid var(--ligne);border-radius:10px;padding:10px 12px;color:var(--creme);font:14px 'Inter',system-ui,sans-serif}
  .share.ok{color:var(--safran);border-color:var(--safran)}
  .loading,.notfound{padding:50px 0;text-align:center;color:var(--muet)}
  footer{border-top:1px solid var(--ligne);margin-top:34px;padding:24px 0;text-align:center;color:var(--muet);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="decouvrir.html" style="display:flex;flex-direction:column;line-height:1;text-decoration:none">
      <span class="logo">Sén Péi</span><span class="sig">un Monde Pixie</span>
    </a>
    <a class="back" href="decouvrir.html">← Découvrir</a>
  </header>
  <div id="content"><div class="loading">Chargement…</div></div>
  <footer>Sén Péi — un Monde Pixie · La Réunion<br><a class="mentions" href="mentions-legales.html">Mentions légales et données personnelles</a></footer>
</div>

<!-- supabase-js 2.118.0, hébergé sur le site (voir vendor/LISEZMOI.md) -->
<script src="vendor/supabase-js-2.118.0.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"></script>
<script type="module">
const { createClient } = window.supabase
const sb=createClient('https://acxfzftptzgdhaakldve.supabase.co','sb_publishable_7bsk8ewqRUebVTqLrqbiaQ_UX78uMfr')
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
// Lien saisi par un membre : on n'accepte que http(s), jamais javascript: ou data:
function safeUrl(u){
  u=(u||'').trim(); if(!u)return null
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u
  try{const x=new URL(u);return /^https?:$/.test(x.protocol)&&x.hostname.includes('.')?x.href:null}catch(e){return null}
}
// Date limite passée = appel clos pour le public ; dates lues en français (heure de La Réunion)
const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Indian/Reunion'})
const ouvert=b=>!b.date_limite||b.date_limite>=today
const dateFr=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long',year:'numeric'})
const limite=b=>b.date_limite?("jusqu'au "+dateFr(b.date_limite)):null
const host=u=>{try{return new URL(u).host.replace(/^www\./,'')}catch(e){return u}}
const p=new URLSearchParams(location.search)
const type=p.get('type'), id=p.get('id')
const C=document.getElementById('content')

// Vidéo d'artiste : le lecteur YouTube ou Vimeo n'est créé qu'au clic sur « Lire la vidéo ».
// Avant ce clic, aucune requête ne part chez eux (ni adresse de l'appareil, ni cookie).
// YouTube passe par youtube-nocookie.com, Vimeo reçoit dnt=1 (« ne pas suivre »).
function embed(url){
  if(!url)return null
  const y=url.match(/(?:youtube(?:-nocookie)?\.com\/.*[?&]v=|youtu\.be\/|youtube(?:-nocookie)?\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{11})/)
  if(y)return {src:'https://www.youtube-nocookie.com/embed/'+y[1]+'?autoplay=1&rel=0',chez:'YouTube'}
  const v=url.match(/vimeo\.com\/(?:video\/)?(\d+)/)
  if(v)return {src:'https://player.vimeo.com/video/'+v[1]+'?dnt=1&autoplay=1',chez:'Vimeo'}
  return null
}
function lecteur(bouton,emb,nom){
  bouton.onclick=()=>{
    const f=document.createElement('iframe')
    f.src=emb.src
    f.title='Vidéo de '+(nom||"l'artiste")
    f.allow='autoplay; fullscreen; picture-in-picture; encrypted-media'
    f.allowFullscreen=true
    f.referrerPolicy='strict-origin-when-cross-origin'
    bouton.parentElement.classList.remove('vignette')
    bouton.replaceWith(f)
    f.focus()
  }
}
// Partager : feuille de partage du téléphone, sinon lien copié
function partage(nom){
  C.querySelector('.card').insertAdjacentHTML('beforeend','<button class="share" id="partager" type="button">↗ Partager cette fiche</button>')
  const b=document.getElementById('partager')
  b.onclick=async()=>{
    const url=location.href.split('#')[0]
    if(navigator.share){try{await navigator.share({title:(nom||'Une fiche')+' — Sén Péi',url})}catch(e){};return}
    try{await navigator.clipboard.writeText(url);b.textContent='✓ Lien copié';b.classList.add('ok')}
    catch(e){ // copie refusée : on montre le lien, sélectionné, prêt à copier
      if(!document.getElementById('lien-fiche'))b.insertAdjacentHTML('afterend','<input class="lien" id="lien-fiche" readonly aria-label="Lien de la fiche">')
      const i=document.getElementById('lien-fiche');i.value=url;i.focus();i.select()
    }
  }
}
function notfound(){C.innerHTML='<div class="notfound">Fiche introuvable. <a href="decouvrir.html" style="color:var(--safran)">Retour à Découvrir →</a></div>'}

;(async()=>{
  if(!id||(type!=='lieu'&&type!=='artiste'))return notfound()
  const table=type==='lieu'?'scene_lieux':'scene_artistes'
  const cols=type==='lieu'?'id,nom,type_lieu,commune,zone,jauge,disciplines,description,contact,site_web':'id,nom,disciplines,bio,zone,video_url,references_jouees,tarif_indicatif,dispo'
  const {data}=await sb.from(table).select(cols).eq('id',id).maybeSingle()
  if(!data)return notfound()
  document.title=(data.nom||'Fiche')+' — Sén Péi'
  const resume=(type==='lieu'?data.description:data.bio)||((type==='lieu'?'Lieu':'Artiste')+' de la scène péi, sur Sén Péi.')
  document.querySelector('meta[name=description]').content=resume.slice(0,160)

  if(type==='lieu'){
    const {data:ap}=await sb.from('scene_besoins').select('*').eq('lieu_id',id).eq('statut','ouvert').order('created_at',{ascending:false})
    const appels=(ap||[]).filter(ouvert).map(b=>`<div class="appel"><b>${esc(b.titre)}</b><div class="m">${[b.discipline,b.periode,limite(b)].filter(Boolean).map(esc).join(' · ')}</div>${b.description?`<div class="desc" style="margin-top:8px;font-size:14px">${esc(b.description)}</div>`:''}</div>`).join('')
    C.innerHTML=`<div class="card">
      <span class="kind lieu">Lieu</span>
      <h1>${esc(data.nom)}</h1>
      <div class="meta">${[data.type_lieu,data.commune,data.zone,data.jauge?('jauge '+data.jauge):null].filter(Boolean).map(esc).join(' · ')}</div>
      <div class="tagrow">${(data.disciplines||[]).map(d=>`<span class="tg">${esc(d)}</span>`).join('')}</div>
      ${data.description?`<div class="desc">${esc(data.description)}</div>`:''}
      ${data.contact?`<div class="field"><div class="l">Contact</div><div class="v">${esc(data.contact)}</div></div>`:''}
      ${safeUrl(data.site_web)?`<div class="field"><div class="l">Site web</div><div class="v"><a href="${esc(safeUrl(data.site_web))}" target="_blank" rel="noopener nofollow" style="color:var(--safran)">${esc(host(safeUrl(data.site_web)))}</a></div></div>`:''}
    </div>
    ${appels?`<h2>Ses appels à candidature</h2>${appels}<a class="cta" href="app.html">Candidater (connecte-toi) →</a>`:''}`
  }else{
    const emb=embed(data.video_url)
    // Agenda : seulement le jour (ni lieu, ni client). Les 12 prochains.
    const {data:dp}=await sb.from('scene_dates_prises').select('jour').eq('artiste_id',id).gte('jour',today).order('jour').limit(12)
    const pris=(dp||[]).map(d=>d.jour)
    C.innerHTML=`<div class="card">
      <span class="kind artiste">Artiste</span>
      <h1>${esc(data.nom)}</h1>
      <div class="meta">${[data.zone,data.tarif_indicatif].filter(Boolean).map(esc).join(' · ')}</div>
      <div class="tagrow">${(data.disciplines||[]).map(d=>`<span class="tg">${esc(d)}</span>`).join('')}</div>
      ${emb?`<div class="video vignette"><button class="lire" id="lire-video" type="button" aria-label="Lire la vidéo de ${esc(data.nom)}" aria-describedby="video-note"><span class="rond" aria-hidden="true">▶</span><span>Lire la vidéo</span><span class="n" id="video-note">Hébergée par ${emb.chez} · se charge seulement au clic</span></button></div>`
        :(safeUrl(data.video_url)?`<div class="field"><div class="l">Vidéo</div><div class="v"><a href="${esc(safeUrl(data.video_url))}" target="_blank" rel="noopener nofollow" style="color:var(--corail)">▶ voir la vidéo (${esc(host(safeUrl(data.video_url)))})</a></div></div>`:'')}
      ${data.bio?`<div class="desc">${esc(data.bio)}</div>`:''}
      ${data.references_jouees?`<div class="field"><div class="l">Déjà joué à</div><div class="v">${esc(data.references_jouees)}</div></div>`:''}
      ${data.dispo?`<div class="field"><div class="l">Disponibilités</div><div class="v">${esc(data.dispo)}</div></div>`:''}
      ${pris.length?`<div class="field"><div class="l">Prochaines dates déjà prises</div><div class="tagrow">${pris.map(d=>`<span class="tg pris">${esc(dateFr(d))}</span>`).join('')}</div></div>`:''}
    </div>
    <a class="cta" href="app.html">Tu cherches un artiste ? Rejoins Sén Péi →</a>`
    if(emb)lecteur(document.getElementById('lire-video'),emb,data.nom)
  }
  partage(data.nom)
})()
</script>
</body>
</html>
